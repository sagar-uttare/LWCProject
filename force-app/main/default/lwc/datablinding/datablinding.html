<template>
<!-- <p>Hello,{geeting}</p>  -->
    <div class="slds-var-m-around_medium">
        <lightning-input name="fName" label="First Name" onchange={handleChange}></lightning-input>
        <lightning-input name="lName" label="Last Name" onchange={handleChange}></lightning-input>
        <p class="slds-var-m-top_medium">UpperCase : {upperCase}</p>
    </div>
    <lightning-button variant="brand" label="Brand" title="Primary action" onclick={handleClick} class="slds-var-m-bottom_medium"></lightning-button>
    <lightning-button variant="destructive" label="Destructive" title="Destructive action" onclick={handleClick} class="slds-var-m-left_x-small"></lightning-button>
   
    <lightning-card>
    <h1 class="slds-text-align_center">Hello,{firstName} {lastName} Welcome</h1>
    <lightning-input label="First Name" value={firstName1} name ='fname'></lightning-input>
    <lightning-input label="Last Name" value={lastName1} name = 'lname'></lightning-input> 
    <br>
    <lightning-button label="Click Me" onclick={handleClick} variant="brand"></lightning-button>
    </lightning-card>
       
    
</template>
